schema_version: 1

context:
  version: "0.49.0"

package:
  name: poethepoet
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/p/poethepoet/poethepoet-${{ version }}.tar.gz
    sha256: 256b72c057b5f60341bbe09498212939e558341fac4ab59d0ce478aca04f0d2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - poe = poethepoet:main

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry >=0.12
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - pastel >=0.2.0,<0.3.0
    - tomlkit >=0.6.0,<1.0.0
    - pyyaml
    - tomli

tests:
  - python:
      imports:
        - poethepoet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
    script:
      - poe --help

about:
  summary: A task runner that works well with poetry.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/nat-n/poethepoet

extra:
  recipe-maintainers:
    - Dhananjhay
    - jsmolic
